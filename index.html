<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noleggio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.jpg" type="image/x-icon">
</head>
<body>
    <div class="container">
        <fieldset>
            <legend>Dati Personali</legend>
            <form action="noleggio.php" method="POST">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
                <br>
                <label for="cognome">Cognome:</label>
                <input type="text" id="cognome" name="cognome" required>
                <br>
                <label for="data_inizio">Data Inizio:</label>
                <input type="date" id="data_inizio" name="data_inizio" required>
                <br>
                <label for="data_fine">Data Fine:</label>
                <input type="date" id="data_fine" name="data_fine" required>
                <br>
                <label for="ore">Ore di utilizzo giornaliero:</label>
                <input type="number" id="ore" name="ore" required max="24" min="1">
                <br>
                <input type="submit" value="Noleggia" name="invia">
            </form>
        </fieldset>
    </div>
</body>
</html>
